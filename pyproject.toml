[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-slop"
version = "1.0.0"
description = "Plataforma autônoma de geração de vídeos curtos 9:16 com arquitetura multi-agentes e auto-recuperação"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Arthur Londres" }
]
dependencies = [
    "google-genai>=1.0.0",
    "edge-tts>=6.1.12",
    "yt-dlp>=2024.0.0",
    "pillow>=10.0.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
